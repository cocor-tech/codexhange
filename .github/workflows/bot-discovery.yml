name: Bot Discovery

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours (6x daily)
  workflow_dispatch:
    inputs:
      fullDiscovery:
        description: 'Full discovery (all brands)'
        type: boolean
        default: true
      maxBrands:
        description: 'Max brands for full discovery (leave empty for all)'
        required: false
      reset:
        description: 'Purge websites/urls/offers before discovery (keeps sources)'
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CONCURRENCY: ${{ secrets.CONCURRENCY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
      ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bot/requirements.txt

      - run: pip install -r requirements.txt
        working-directory: bot

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
        working-directory: bot

      - name: Reset bot data (websites/urls/offers), keep sources
        if: inputs.reset == true
        run: python main.py --reset
        working-directory: bot

      - name: Process admin queued jobs
        run: python main.py --process-jobs
        working-directory: bot

      - name: Source discovery — crawl aggregator sources for new brands + codes
        run: |
          MAX="${{ inputs.maxBrands }}"
          if [ -n "$MAX" ]; then
            python main.py --sources --max-per-source "$MAX"
          else
            python main.py --sources
          fi
        working-directory: bot

      - name: Check if this is the 6am UTC run (full discovery)
        id: should_full
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ]; then
            echo "full=true" >> $GITHUB_OUTPUT
          else
            echo "full=false" >> $GITHUB_OUTPUT
          fi

      - name: Full discovery (6am only)
        if: steps.should_full.outputs.full == 'true' || inputs.fullDiscovery == true
        run: |
          MAX="${{ inputs.maxBrands }}"
          if [ -n "$MAX" ]; then
            python main.py --scan --max "$MAX"
          else
            python main.py --scan
          fi
        working-directory: bot

      - name: Incremental discovery — stale brands only (all other runs)
        if: steps.should_full.outputs.full != 'true' && inputs.fullDiscovery != true
        run: python main.py --stale
        working-directory: bot