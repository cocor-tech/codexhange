name: Bot Discovery

on:
  schedule:
    - cron: '0 */4 * * *'   # Every 4 hours (6x daily)
  workflow_dispatch:
    inputs:
      fullDiscovery:
        description: 'Full discovery (all brands)'
        type: boolean
        default: true
      maxBrands:
        description: 'Max brands for full discovery (leave empty for all)'
        required: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      CONCURRENCY: ${{ secrets.CONCURRENCY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
      ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - run: npm ci
        working-directory: bot

      - name: Install Playwright browsers (for JS-heavy sites)
        run: npx playwright install chromium
        working-directory: bot

      - name: Process admin queued jobs
        run: |
          while node standalone.js --queue; do
            echo "Processing next job..."
          done
        working-directory: bot

      - name: Check if this is the 6am UTC run (full discovery)
        id: should_full
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "06" ]; then
            echo "full=true" >> $GITHUB_OUTPUT
          else
            echo "full=false" >> $GITHUB_OUTPUT
          fi

      - name: Full discovery (6am only)
        if: steps.should_full.outputs.full == 'true' || inputs.fullDiscovery == true
        run: |
          MAX="${{ inputs.maxBrands }}"
          if [ -n "$MAX" ]; then
            node standalone.js --brands --max "$MAX"
          else
            node standalone.js --brands
          fi
        working-directory: bot

      - name: Incremental discovery — stale brands only (all other runs)
        if: steps.should_full.outputs.full != 'true' && inputs.fullDiscovery != true
        run: node standalone.js --stale
        working-directory: bot
